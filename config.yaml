# Black Friday & 해외직구 찐할인 레이더 설정
# 원하는 키워드나 기준 점수를 자유롭게 수정하세요.

radar:
  # 이 점수(0~100) 이상인 딜만 텔레그램 알림 발송
  # - 60: 폭넓게 수신
  # - 66~72: 진짜 할인 폭이 크거나 역대가 검증된 딜 위주 (최적 기본값)
  # - 80+: 초특가 / 교차검증 역대가만 수신
  min_score: 66

  # 한 번 실행 시 최대 발송 알림 수 (첫 실행 시 알림 폭탄 방지)
  max_alerts_per_run: 8

  # 이 시간(시간 단위) 이내 올라온 최신 딜만 알림 대상
  max_age_hours: 18

  # 가격 상한/하한 필터 (USD, null이면 제한 없음)
  min_price_usd: 5.0
  max_price_usd: null

  # 관부가세 면세 기준 (미국 목록통관 $200)
  us_customs_threshold_usd: 200.0

  # 실시간 환율 조회 실패 시 기본 환율 (KRW / 1 USD)
  fallback_usd_krw: 1400.0

  # SQLite 상태 저장 파일 경로
  db_path: "data/radar.db"

