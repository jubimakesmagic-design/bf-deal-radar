# Black Friday & 해외직구 찐할인 레이더 설정
# 원하는 키워드나 기준 점수를 자유롭게 수정하세요.

radar:
  # 이 점수(0~100) 이상인 딜만 텔레그램 알림 발송 (엄격 기준)
  # - 70~79: 확실히 저렴한 알짜 찐할인 (기본 알림 컷)
  # - 80~89: 대폭 할인 + 커뮤니티/역대가 검증된 강력 특가
  # - 90+: 쉽게 나오지 않는 역대급 초특가 대란 (100점은 전설급만)
  min_score: 70
  # 국내 핫딜(쿠팡·네이버·G마켓·롯데온·무신사·알리 등 전 품목) 최소 알림 점수
  kr_min_score: 70

  # 한 번 실행 시 최대 발송 알림 수 (첫 실행 시 알림 폭탄 방지)
  max_alerts_per_run: 8

  # 이 시간(시간 단위) 이내 올라온 최신 딜만 알림 대상
  max_age_hours: 18

  # 내부 가격 이력(KRW/USD 기준가 누적) 보관 일수
  price_history_days: 60

  # 가격 상한/하한 필터 (USD / KRW, null이면 제한 없음)
  min_price_usd: 5.0
  max_price_usd: null
  # 국내 5원/10원/500원 포인트 적립 스팸 자동 차단
  min_price_krw: 3000

  # 관부가세 면세 기준 (미국 목록통관 $200)
  us_customs_threshold_usd: 200.0

  # 실시간 환율 조회 실패 시 기본 환율 (KRW / 1 USD)
  fallback_usd_krw: 1400.0

  # SQLite 상태 저장 파일 경로
  db_path: "data/radar.db"

